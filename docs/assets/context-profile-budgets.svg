<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">CompText Conductor Max profile budgets</title>
  <desc id="desc">SAFE has a 30000 token hard limit, BALANCED 18000, and MAX 10000.</desc>
  <style>
    .title{font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f}.sub{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#57606a}.label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f}.value{font:700 16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#24292f}.axis{stroke:#d0d7de;stroke-width:1}.safe{fill:#54aeff}.balanced{fill:#8250df}.max{fill:#cf222e}.small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#57606a}
    @media (prefers-color-scheme:dark){.title,.label,.value{fill:#f0f6fc}.sub,.small{fill:#8c959f}.axis{stroke:#30363d}}
  </style>
  <text x="48" y="54" class="title">Context budget profiles</text>
  <text x="48" y="80" class="sub">Hard ceilings; callers may request less, never more than the selected profile allows.</text>
  <line x1="210" y1="112" x2="900" y2="112" class="axis"/>
  <text x="48" y="160" class="label">SAFE</text>
  <rect x="210" y="134" width="650" height="42" rx="8" class="safe"/>
  <text x="875" y="161" class="value" text-anchor="end">30,000</text>
  <text x="48" y="230" class="label">BALANCED</text>
  <rect x="210" y="204" width="390" height="42" rx="8" class="balanced"/>
  <text x="615" y="231" class="value">18,000</text>
  <text x="48" y="300" class="label">MAX</text>
  <rect x="210" y="274" width="217" height="42" rx="8" class="max"/>
  <text x="442" y="301" class="value">10,000</text>
  <text x="48" y="360" class="small">Priority remains correctness-first in every profile; MAX is aggressive, not lossy-by-design.</text>
  <text x="48" y="388" class="small">Units: configured hard-limit tokens. Runtime output is labelled estimated_tokens unless an exact tokenizer is available.</text>
</svg>