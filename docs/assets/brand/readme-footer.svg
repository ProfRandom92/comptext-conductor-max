<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="180" viewBox="0 0 1600 180" role="img" aria-labelledby="title desc">
  <title id="title">CompText Conductor Max footer</title>
  <desc id="desc">Branded README footer for CompText Conductor Max.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050915"/>
      <stop offset=".5" stop-color="#080b18"/>
      <stop offset="1" stop-color="#090512"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20def6"/>
      <stop offset=".55" stop-color="#4a90ff"/>
      <stop offset="1" stop-color="#a65bff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="1600" height="180" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1598" height="178" rx="23" fill="none" stroke="#264e74" stroke-opacity=".32"/>
  <path d="M40 30H1560" stroke="url(#brand)" stroke-width="1" opacity=".32"/>

