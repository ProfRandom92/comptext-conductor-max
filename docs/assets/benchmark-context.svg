<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">CompText Conductor Max measured context benchmark</title>
  <desc id="desc">Synthetic benchmark comparing naive full context at 246520 estimated tokens with CompText Conductor Max at 3478 estimated tokens, a 98.59 percent reduction.</desc>
  <style>
    .title{font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f}.sub{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#57606a}.label{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f}.value{font:700 18px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#24292f}.axis{stroke:#d0d7de;stroke-width:1}.naive{fill:#8c959f}.broker{fill:#2da44e}.callout{font:800 42px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#2da44e}.small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#57606a}
    @media (prefers-color-scheme:dark){.title,.label,.value{fill:#f0f6fc}.sub,.small{fill:#8c959f}.axis{stroke:#30363d}}
  </style>
  <text x="48" y="54" class="title">Measured context delivered to the model</text>
  <text x="48" y="80" class="sub">Reproducible synthetic fixture · seed 20260807 · metric: estimated_tokens</text>
  <line x1="210" y1="118" x2="900" y2="118" class="axis"/>
  <line x1="210" y1="118" x2="210" y2="282" class="axis"/>
  <text x="48" y="164" class="label">Naive full context</text>
  <rect x="210" y="138" width="650" height="42" rx="8" class="naive"/>
  <text x="875" y="166" class="value" text-anchor="end">246,520</text>
  <text x="48" y="234" class="label">Conductor Max</text>
  <rect x="210" y="208" width="9.2" height="42" rx="5" class="broker"/>
  <text x="238" y="236" class="value">3,478</text>
  <text x="48" y="334" class="callout">98.59% less delivered context</text>
  <text x="50" y="366" class="small">986,077 raw bytes → 13,910 returned bytes · 0/10 required facts missing in this fixture</text>
  <text x="50" y="395" class="small">This result is benchmark-specific and is not a universal token-savings guarantee.</text>
</svg>